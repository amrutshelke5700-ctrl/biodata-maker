      <stop offset="0%" stop-color="#8E1A50" />
      <stop offset="55%" stop-color="#7F1D1D" />
      <stop offset="100%" stop-color="#581018" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
  </defs>

  <!-- Royal Maroon Crest Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#maroonBg)" />
  <rect x="5" y="5" width="54" height="54" rx="11" stroke="url(#goldAccent)" stroke-width="2" />

  <!-- Subtle Golden Lotus Crest at Top -->
  <path
