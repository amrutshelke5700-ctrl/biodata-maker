  <path d="M22.8 40C23.4 38.3 27.1 38.3 27.7 40" stroke="#7F1D1D" stroke-width="1.4" stroke-linecap="round" />

  <path d="M33 33.5H43" stroke="#B8860B" stroke-width="2.1" stroke-linecap="round" />
  <path d="M33 38H43" stroke="#9A3412" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  <path d="M33 42.5H40" stroke="#9A3412" stroke-width="2" stroke-linecap="round" opacity="0.7" />

